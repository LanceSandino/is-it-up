# Comprehensive Secrets Configuration Examples
#
# This configuration demonstrates ALL supported secret formats and patterns.
# Multiple AWS Secrets Manager secrets are referenced to show different approaches:
#
# 1. MAIN CREDENTIALS SECRET: is-it-up/config
#    Official ARN: sm:  #   address: sm://eu-config/endpoints#api_base?region=eu-west-1
  # Or use the web app address secret:
  #   address: sm://is-it-up/web-app-address/arn:aws:secretsmanager:us-east-2:123456789012:secret:is-it-up/config-example
#    Shorthand: sm://is-it-up/config
#    Payload: {
#      "mysql.user": "appuser",
#      "mysql.password": "apppass",
#      "rabbitmq.user": "guest",
#      "rabbitmq.pass": "guest",
#      "redis.password": "<redis-value>",
#      "opensearch.java.opts": "-Xms512m -Xmx512m"
#    }
#
# 2. WEB APPLICATION ADDRESS SECRET: is-it-up/web-app-address
#    Official ARN: sm://arn:aws:secretsmanager:us-east-2:123456789012:secret:is-it-up/web-app-address-example
#    Shorthand: sm://is-it-up/web-app-address
#    Payload: "http://localhost:8080"  (full URL with protocol scheme)
#
# 3. NESTED STRUCTURE SECRET: app/database-config
#    Payload: {
#      "database": {
#        "primary": {"host": "primary-db.example.com", "port": 3306},
#        "replica": {"host": "replica-db.example.com", "port": 3306}
#      },
#      "cache": {"redis": {"endpoint": "cache.example.com:6379"}}
#    }
#
# 4. SIMPLE PASSWORD SECRET: app/simple-token
#    Payload: "SimpleTokenValue123"  (entire payload is the secret)
#
# 5. REGIONAL SECRET: eu-config/endpoints
#    Payload: {"api_base": "https://eu.api.example.com"}
#
# Ways to specify a password (or any scalar secret) in AWS Secrets Manager
# supported by this project (parsing is pure; resolution happens at runtime):
#
# 1) Plain scalar SecretString (entire payload is the password)
#    - When the SecretString is just the password text you can reference the
#      secret as a scalar URI. The fetched SecretString is used as the value.
#    Example:
#      address: sm://is-it-up/web-app-address
#
# 2) Extract a top-level key using a fragment (literal key or key-with-dots)
#    - Use '#key' to extract a JSON/YAML top-level key from the secret payload.
#    - If the key name itself contains dots (e.g. 'mysql.password') use that
#      literal as the fragment — the resolver tries dotted traversal first and
#      falls back to a literal top-level lookup.
#    Examples:
#      password: sm://is-it-up/config#mysql.password
#      password: sm://is-it-up/config#rabbitmq.pass
#
# 3) Dotted traversal for nested JSON values
#    - If the secret payload is nested JSON, use dotted fragments to traverse.
#    Example (payload {"db": {"creds": {"password":"..."}}}):
#      password: sm://is-it-up/config#db.creds.password
#
# 4) Mapping form (YAML) with explicit secret metadata
#    - Instead of a scalar string you can provide a mapping which decodes to
#      a SecretRef. This allows specifying secret_id, key, region and provider.
#    Examples (two equivalent forms accepted by the parser):
#      password:
#        secret:
#          secret_id: is-it-up/config
#          key: mysql.password
#          region: us-east-2
#
#      password:
#        secret_id: is-it-up/config
#        key: mysql.password
#        region: us-east-2
#
# 5) Full ARN form
#    - You can include a full Secrets Manager ARN in the scalar form. When an
#      ARN contains a region the resolver will use a region-scoped AWS client
#      for that secret (so AWS_REGION is not required).
#    Example:
#      password: sm://arn:aws:secretsmanager:us-east-2:123456789012:secret:is-it-up/config-example#mysql.password
#
# 6) Query parameters: region / stage
#    - The compact URI supports a query string for optional params like region
#      and stage (stage is recorded on the SecretRef). Examples:
#      password: sm://is-it-up/config#mysql.password?region=us-east-2
#      password: sm://is-it-up/config#mysql.password?stage=AWSCURRENT
#
# 7) SecretBinary (binary payload)
#    - If Secrets Manager returns SecretBinary the SDK provides decoded bytes.
#      The fetcher treats binary payloads as raw bytes converted to string
#      (suitable for storing base64-encoded secrets or other binary content).
#    - Example (no special YAML syntax; this depends on how the secret is stored):
#      certificate: sm://is-it-up/web-app-address
#
# 8) Literal fallback / inline literal
#    - You can still specify a literal password in the config (no sm://):
#      password: apppass
#    - Dotted traversal fallback: when using a fragment like '#a.b' the
#      resolver will try dotted traversal then fall back to checking for a
#      top-level literal key named 'a.b' before returning MissingKeyError.
#
# 9) Provider note
#    - The parser defaults to the AWS Secrets Manager provider when a mapping
#      does not include a provider value. If you need to declare provider:
#      password:
#        secret:
#          provider: aws-secrets-manager
#          secret_id: is-it-up/config
#          key: mysql.password
#
# Implementation note:
# - Unmarshalling is pure (no network I/O). The SecretRef is parsed and
#   stored in the config; actual fetching occurs at runtime via an injected
#   SecretFetcher implementation (the project includes an AWS one using
#   the official AWS SDK v2 and a mock for tests).


checks:
  # ========================================
  # 1. COMPACT URI FORMAT - Basic Examples
  # ========================================

  - name: web-app-basic
    type: http
    # SIMPLE SECRET: Entire payload as value (full URL with protocol)
    address: sm://is-it-up/web-app-address
    path: /health
    timeout_ms: 5000
    severity: critical

  - name: web-app-protocol-example
    type: http
    # ALTERNATIVE: Separate protocol and host (if you need flexibility)
    # Note: This uses literal values to show the pattern
    address: http://localhost:8080  # Could be: protocol://sm://secret#host
    path: /status
    timeout_ms: 3000
    severity: info

  - name: database-compact-uri
    type: mysql
    # COMPACT URI: Basic key extraction from flat JSON
    user: sm://is-it-up/config#mysql.user
    password: sm://is-it-up/config#mysql.password
    address: localhost:3306
    timeout_ms: 10000
    severity: critical

  - name: redis-compact-uri
    type: redis
    # COMPACT URI: Literal key with dots (tries dotted traversal first, then literal)
    password: sm://is-it-up/config#redis.password
    address: localhost:6379
    redis_info: true
    timeout_ms: 3000
    severity: critical

  # ========================================
  # 2. FULL ARN FORMAT with Auto-Region Detection
  # ========================================

  - name: rabbitmq-full-arn
    type: rabbitmq
  # AMQP is the default for rabbitmq checks
    # FULL ARN: Region auto-detected from ARN, no AWS_REGION needed
    user: sm://arn:aws:secretsmanager:us-east-2:123456789012:secret:is-it-up/config-example#rabbitmq.user
    password: sm://arn:aws:secretsmanager:us-east-2:123456789012:secret:is-it-up/config-example#rabbitmq.pass
    vhost: /
    address: localhost:5672
    timeout_ms: 3000
    severity: critical

  # ========================================
  # 3. QUERY PARAMETERS - Region and Stage
  # ========================================

  - name: elasticsearch-with-region
    type: elasticsearch
    # QUERY PARAMS: Explicit region specification
    address: http://localhost:9200
    path: _cluster/health
    timeout_ms: 4000
    severity: critical
    # Example showing region query parameter (though not used for address in this check)
    # custom_field: sm://is-it-up/config#opensearch.java.opts?region=us-east-2

  # ========================================
  # 4. MAPPING FORMAT - Form 1 (Nested)
  # ========================================

  - name: mysql-mapping-nested
    type: mysql
    # MAPPING FORM 1: Nested under 'secret' key
    user:
      secret:
        provider: aws-secrets-manager
        secret_id: is-it-up/config
        key: mysql.user
        region: us-east-2
    password:
      secret:
        provider: aws-secrets-manager
        secret_id: is-it-up/config
        key: mysql.password
        region: us-east-2
    address: localhost:3306
    timeout_ms: 8000
    severity: warning

  # ========================================
  # 5. MAPPING FORMAT - Form 2 (Direct)
  # ========================================

  - name: redis-mapping-direct
    type: redis
    # MAPPING FORM 2: Direct mapping (no nested 'secret' key)
    password:
      secret_id: is-it-up/config
      key: redis.password
      region: us-east-2
      provider: aws-secrets-manager
    address: localhost:6379
    redis_info: false
    timeout_ms: 2000
    severity: warning

  # ========================================
  # 6. MIXED LITERAL and SECRET Values
  # ========================================

  - name: mixed-configuration
    type: rabbitmq
    # MIXED: Literal values combined with secrets
    address: localhost:5672          # Literal value
    user: sm://is-it-up/config#rabbitmq.user      # Secret value
    password: sm://is-it-up/config#rabbitmq.pass  # Secret value
    vhost: /                         # Literal value
    timeout_ms: 2500
    severity: info

  # ========================================
  # 7. TCP CONNECTION with Shared Credentials
  # ========================================

  - name: tcp-connection-test
    type: tcp
    address: localhost:3306
    timeout_ms: 2000
    severity: info
    # Demonstrates TCP connectivity check (no credentials needed)

  # ========================================
  # 8. SMTP EMAIL SERVER with AWS SES
  # ========================================

  - name: smtp-ses-example
    type: smtp
    address: localhost:1025
    # AWS SES SMTP endpoint with secret-sourced encryption
    #host: sm://is-it-up/config#smtp.host
    #port: sm://is-it-up/config#smtp.port
    #user: sm://is-it-up/config#smtp.user
    #password: sm://is-it-up/config#smtp.password
    #smtp_encryption: sm://is-it-up/config#smtp.encryption
    timeout_ms: 8000
    severity: warning

  # ========================================
  # 8. ADDITIONAL FORMAT EXAMPLES (Commented)
  # ========================================

  # The following are examples of additional secret patterns supported:
  #
  # SIMPLE/ENTIRE SECRET PAYLOAD:
  # - name: simple-token-example
  #   type: http
  #   address: sm://is-it-up/web-app-address  # Full URL: "http://localhost:8080"
  #   # auth_token: sm://app/simple-token
  #
  # PROTOCOL CONSIDERATIONS:
  # For HTTP checks, ensure secrets contain full URLs with protocol:
  # ✅ GOOD: "http://api.example.com" or "https://secure.example.com"
  # ❌ BAD:  "api.example.com" or "localhost:8080"
  #
  # NOTE: The is-it-up/web-app-address secret now contains "http://localhost:8080"
  # which resolves the "unsupported protocol scheme" error.
  #
  # NESTED JSON with Dotted Traversal:
  # - name: nested-config-example
  #   type: mysql
  #   address: localhost:3306
  #   # user: sm://app/database-config#database.primary.username
  #   # password: sm://app/database-config#database.primary.password
  #
  # STAGE/VERSION EXAMPLES:
  # - name: versioned-secret-example
  #   type: http
  #   address: sm://is-it-up/web-app-address
  #   # api_key: sm://is-it-up/config#api.key?stage=AWSCURRENT
  #   # api_key: sm://is-it-up/config#api.key?stage=AWSPENDING
  #
  # BINARY SECRET EXAMPLE:
  # - name: binary-secret-demo
  #   type: http
  #   address: sm://is-it-up/web-app-address
  #   # tls_cert: sm://app/certificates#server_cert  # Binary converted to string
  #
  # REGIONAL SECRETS:
  # - name: eu-endpoint-example
  #   type: http
  #   # address: sm://eu-config/endpoints#api_base?region=eu-west-1

# ========================================
# COMPREHENSIVE SECRETS EXAMPLES SUMMARY
# ========================================
#
# This configuration demonstrates ALL supported secret formats:
#
# ✅ IMPLEMENTED & WORKING EXAMPLES:
# • Compact URI format: sm://secret#key
# • Full ARN format with auto-region detection
# • Mapping format - Form 1 (nested under 'secret' key)
# • Mapping format - Form 2 (direct mapping)
# • Query parameters (region specification)
# • Mixed literal and secret configurations
# • Multiple check types with various secret patterns
# • Literal key extraction (keys containing dots)
#
# 📋 ADDITIONAL SUPPORTED FORMATS (commented examples above):
# • Simple/entire payload secrets (entire secret as value)
# • Nested JSON with dotted traversal (navigate deep structures)
# • Stage/version parameters (AWSCURRENT, AWSPENDING, etc.)
# • Binary secret handling (base64, certificates, etc.)
# • Regional secrets (different regions per secret)
# • Cross-region secret access
#
# 🔧 TESTING:
# Run this configuration with:
#   AWS_REGION=us-east-2 ./is-it-up -config example/aws-secret.example.yaml --dump-resolved-config
#   AWS_REGION=us-east-2 ./is-it-up -config example/aws-secret.example.yaml --dump-resolved-config --debug
#   AWS_REGION=us-east-2 ./is-it-up -config example/aws-secret.example.yaml --pretty
#
# 🔑 REQUIRED SECRETS:
# • is-it-up/config (ARN: ...secret:is-it-up/config-DjQgOC)
#   Contains keys such as mysql.user, mysql.password, smtp.host, smtp.user, and smtp.password.
# • is-it-up/web-app-address (ARN: ...secret:is-it-up/web-app-address-oqAtHL)
#   Contains: "http://localhost:8080" (MUST include protocol scheme)
#
# 📚 Complete documentation: docs/SECRETS.md
# 🏗️ Architecture details: docs/ARCHITECTURE.md
# 🔍 Check types reference: docs/CHECKS.md
